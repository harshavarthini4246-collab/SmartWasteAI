{% extends "base.html" %}
{% block content %}
<div class="container py-5">
 <div class="row justify-content-center">
  <div class="col-lg-8">
   <div class="card shadow border-0 p-4">
    <h2>🍱 Add Surplus Food</h2>
    <p class="text-muted">The AI engine will automatically rank suitable NGOs.</p>
    <form method="POST">
      <div class="row">
       <div class="col-md-6 mb-3"><label>Food Name</label><input name="food_name" class="form-control" placeholder="Cooked Rice" required></div>
       <div class="col-md-6 mb-3"><label>Food Type</label>
        <select name="food_type" class="form-select"><option>Cooked Food</option><option>Rice</option><option>Vegetables</option><option>Fruits</option><option>Bread</option><option>Any</option></select>
       </div>
       <div class="col-md-6 mb-3"><label>Quantity (kg)</label><input name="quantity" type="number" step="0.1" class="form-control" required></div>
       <div class="col-md-6 mb-3"><label>Location</label><input name="location" class="form-control" value="Coimbatore" required></div>
       <div class="col-md-6 mb-3"><label>Prepared Time</label><input name="prepared_time" type="datetime-local" class="form-control" required></div>
       <div class="col-md-6 mb-3"><label>Expiry Time</label><input name="expiry_time" type="datetime-local" class="form-control" required></div>
      </div>
      <div class="alert alert-info">💡 For this demo, location coordinates default to Coimbatore. The matching engine uses distance + urgency + requirement + capacity.</div>
      <input type="hidden" name="lat" value="11.0168">
      <input type="hidden" name="lon" value="76.9558">
      <button class="btn btn-success btn-lg">Post Donation & Run AI Matching</button>
    </form>
   </div>
  </div>
 </div>
</div>
{% endblock %}
